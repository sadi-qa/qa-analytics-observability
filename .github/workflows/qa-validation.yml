name: QA Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-validation:
    name: Python and Data Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Validate Python syntax
        run: |
          python -m py_compile \
            scripts/generate_qa_data.py \
            scripts/validate_qa_data.py \
            scripts/qa_metrics_exporter.py

      - name: Validate generated QA data
        run: python scripts/validate_qa_data.py

      - name: Run automated tests
        run: python -m pytest

  observability-validation:
    name: Observability Stack Validation
    needs: python-validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      GRAFANA_ADMIN_USER: qaadmin
      GRAFANA_ADMIN_PASSWORD: ci-validation-password-not-a-secret

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Validate Grafana dashboard JSON
        run: |
          python -m json.tool \
            dashboards/grafana/qa-observability-dashboard.json \
            > /dev/null

          python - <<'PY'
          import json
          from pathlib import Path

          dashboard_path = Path(
              "dashboards/grafana/"
              "qa-observability-dashboard.json"
          )

          dashboard = json.loads(
              dashboard_path.read_text(encoding="utf-8")
          )

          assert dashboard["title"] == "QA Test Observability"
          assert dashboard["uid"] == "qa-test-observability"
          assert len(dashboard["panels"]) == 13

          print(
              "Grafana dashboard JSON validated successfully."
          )
          PY

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Validate Prometheus configuration
        run: |
          docker run --rm \
            --entrypoint /bin/promtool \
            --volume \
            "${GITHUB_WORKSPACE}/config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            prom/prometheus:v3.13.1 \
            check config /etc/prometheus/prometheus.yml

      - name: Build QA metrics exporter image
        run: docker compose build qa-metrics-exporter

      - name: Verify exporter runs as non-root
        run: |
          user_id="$(
            docker run \
              --rm \
              --entrypoint id \
              qa-metrics-exporter:local \
              -u
          )"

          echo "Exporter container user ID: ${user_id}"

          if [ "${user_id}" = "0" ]; then
            echo "Exporter must not run as root."
            exit 1
          fi

      - name: Start observability stack
        run: docker compose up --detach

      - name: Wait for service health
        run: |
          python - <<'PY'
          import time
          import urllib.request

          service_urls = [
              "http://localhost:8000/metrics",
              "http://localhost:9090/-/ready",
              "http://localhost:3000/api/health",
          ]

          maximum_attempts = 30

          for attempt in range(1, maximum_attempts + 1):
              try:
                  for service_url in service_urls:
                      with urllib.request.urlopen(
                          service_url,
                          timeout=5,
                      ) as response:
                          if response.status != 200:
                              raise RuntimeError(
                                  f"{service_url} returned "
                                  f"HTTP {response.status}"
                              )

                  print(
                      "All observability services are healthy."
                  )
                  break

              except Exception as error:
                  if attempt == maximum_attempts:
                      raise RuntimeError(
                          "Observability services did not "
                          "become healthy."
                      ) from error

                  print(
                      f"Health attempt {attempt} failed. "
                      "Retrying in 2 seconds."
                  )

                  time.sleep(2)
          PY

      - name: Verify exporter metrics
        run: |
          python - <<'PY'
          import urllib.request

          with urllib.request.urlopen(
              "http://localhost:8000/metrics",
              timeout=10,
          ) as response:
              metrics = response.read().decode("utf-8")

          expected_metrics = [
              "qa_exporter_last_refresh_success 1.0",
              "qa_test_pass_rate_ratio",
              "qa_automation_coverage_ratio",
              "qa_flaky_test_rate_ratio",
              "qa_defect_leakage_ratio 0.04",
              "qa_release_readiness_score 87.09",
          ]

          for expected_metric in expected_metrics:
              assert expected_metric in metrics, (
                  f"Missing metric: {expected_metric}"
              )

          print(
              "Exporter metrics validated successfully."
          )
          PY

      - name: Verify Prometheus target
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request

          maximum_attempts = 30

          for attempt in range(1, maximum_attempts + 1):
              try:
                  with urllib.request.urlopen(
                      "http://localhost:9090/api/v1/targets",
                      timeout=10,
                  ) as response:
                      payload = json.load(response)

                  active_targets = payload["data"]["activeTargets"]

                  exporter_targets = [
                      target
                      for target in active_targets
                      if target["labels"].get("job")
                      == "qa-metrics-exporter"
                  ]

                  if not exporter_targets:
                      raise RuntimeError(
                          "QA metrics exporter target "
                          "was not found."
                      )

                  exporter_target = exporter_targets[0]

                  if exporter_target["health"] != "up":
                      raise RuntimeError(
                          "QA metrics exporter target "
                          "is not healthy."
                      )

                  if exporter_target["lastError"]:
                      raise RuntimeError(
                          exporter_target["lastError"]
                      )

                  print(
                      "Prometheus target validated "
                      "successfully."
                  )
                  break

              except Exception as error:
                  if attempt == maximum_attempts:
                      raise RuntimeError(
                          "Prometheus did not report the "
                          "exporter target as healthy."
                      ) from error

                  print(
                      f"Target attempt {attempt} failed. "
                      "Retrying in 2 seconds."
                  )

                  time.sleep(2)
          PY

      - name: Verify Grafana health
        run: |
          python - <<'PY'
          import json
          import urllib.request

          with urllib.request.urlopen(
              "http://localhost:3000/api/health",
              timeout=10,
          ) as response:
              payload = json.load(response)

          assert payload["database"] == "ok"
          assert payload["version"] == "13.1.1"

          print("Grafana health validated successfully.")
          PY

      - name: Show service status and logs after failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --no-color || true

      - name: Stop observability stack
        if: always()
        run: |
          docker compose down \
            --volumes \
            --remove-orphans || true